name: CI/CD GastroMind

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests y cobertura (JaCoCo >= 85% en bundle completo)
        run: mvn -B verify "-Djacoco.minimum.covered.ratio=0.85"

      - name: Determinar el Tag de la imagen
        id: set-tag
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
          fi

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Aqui usa tu usuario de Docker Hub y el nombre del repo
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gastromind-api:${{ env.TAG }}
