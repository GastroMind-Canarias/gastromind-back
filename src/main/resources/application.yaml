cxf:
  path: /soap

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://localhost:5432/gastromind_local
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

gastromind:
  security:
    public-urls:
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/api/v1/auth/**"
      - "/actuator/**"
      # SOAP demo: sin JWT a propósito (rúbrica). En producción cerrar con API key, mTLS o túnel.
      - "/soap/**"

app:
  jwt:
    secret: "9a4f2c3d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7a8b9c0d1e4d"
    expiration-minutes: 60
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      # Opcional: lista de modelos alternativos si el principal falla por 429/503/5xx o error de red (en orden).
      fallback-models: [ gemini-2.0-flash ]
      base-url: https://generativelanguage.googleapis.com
    suggestion-cache:
      ttl-days: 10
      key-prefix: "gastromind:recipe:suggestion:"
    ticket:
      max-image-bytes: 10485760
  usual-purchase:
    history-days: 90
    min-distinct-tickets: 2
    low-stock-fraction: 0.3
    recency-half-life-days: 30
    ticket-sync-blend-weight: 0.35
  store:
    pending-cache:
      ttl-days: 5
      key-prefix: "gastromind:store:pending:"
    alias-rate-limit:
      max-attempts: 8
      window-seconds: 3600
      key-prefix: "gastromind:store:alias:rate:"
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:4200"
      - "http://localhost:8081"

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8081
  address: 0.0.0.0